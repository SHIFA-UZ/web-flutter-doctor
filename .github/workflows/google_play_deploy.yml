name: Deploy Doctor App to Google Play

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip Flutter tests'
        required: false
        type: boolean
        default: false

concurrency:
  group: doctor-play-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.35.5'
  JAVA_VERSION: '17'
  API_BASE_URL: 'https://shifa-doc-backend-mvp-production.up.railway.app'

jobs:
  build-and-deploy:
    name: Build & Deploy Shifa Doctor (Open Testing)
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run tests
        if: ${{ !inputs.skip_tests }}
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Decode Firebase Android config
        env:
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.DOCTOR_FIREBASE_ANDROID_CONFIG_BASE64 }}
        run: |
          if [ -z "$FIREBASE_ANDROID_CONFIG_BASE64" ]; then
            echo "::error::DOCTOR_FIREBASE_ANDROID_CONFIG_BASE64 secret not found!"
            exit 1
          fi
          echo "$FIREBASE_ANDROID_CONFIG_BASE64" | base64 --decode > android/app/google-services.json

      - name: Calculate version
        id: version
        run: |
          VERSION_NAME=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          BUILD_NUMBER=$(( 1 + ${{ github.run_number }} ))
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.DOCTOR_ANDROID_KEYSTORE_BASE64 }}
        run: |
          echo "$ANDROID_KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks

      - name: Create key.properties
        run: |
          cat > android/key.properties << EOF
          storeFile=upload-keystore.jks
          storePassword=${{ secrets.DOCTOR_ANDROID_KEYSTORE_PASSWORD }}
          keyAlias=${{ secrets.DOCTOR_ANDROID_KEY_ALIAS }}
          keyPassword=${{ secrets.DOCTOR_ANDROID_KEY_PASSWORD }}
          EOF

      - name: Build Android App Bundle
        run: |
          flutter build appbundle \
            --release \
            --dart-define=ENVIRONMENT=production \
            --dart-define=API_BASE_URL=${{ env.API_BASE_URL }} \
            --build-name=${{ steps.version.outputs.version_name }} \
            --build-number=${{ steps.version.outputs.build_number }}

      - name: Decode Google Play service account key
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64: ${{ secrets.DOCTOR_GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64 }}
        run: |
          echo "$GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64" | base64 --decode > google-play-service-account.json

      - name: Upload to Google Play (Open Testing)
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: google-play-service-account.json
          packageName: com.shifa.doctorapp
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: beta
          status: completed

      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -f android/app/google-services.json
          rm -f android/app/upload-keystore.jks
          rm -f android/key.properties
          rm -f google-play-service-account.json
