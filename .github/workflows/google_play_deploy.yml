name: Deploy Doctor App to Google Play

# Tests run on pull requests (ci.yml), not here.
on:
  workflow_dispatch:
    inputs:
      track:
        description: 'Play track'
        required: true
        type: choice
        options:
          - internal
          - alpha
          - beta
          - production
        default: internal

concurrency:
  group: doctor-play-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  JAVA_VERSION: '17'
  # versionCode = offset + github.run_number. The Flutter app used 1 + run_number (last upload: run 8 =
  # versionCode 9). Same file name, same run counter, same offset: one rising sequence for both apps.
  VERSION_CODE_OFFSET: 1

jobs:
  build-and-deploy:
    name: Build & Deploy Shifa Doctor
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}

      - uses: gradle/actions/setup-gradle@v4

      - name: Decode Firebase Android config
        env:
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.DOCTOR_FIREBASE_ANDROID_CONFIG_BASE64 }}
        run: |
          if [ -z "$FIREBASE_ANDROID_CONFIG_BASE64" ]; then
            echo "::error::DOCTOR_FIREBASE_ANDROID_CONFIG_BASE64 secret not found!"
            exit 1
          fi
          echo "$FIREBASE_ANDROID_CONFIG_BASE64" | base64 --decode > composeApp/google-services.json

      - name: Calculate version
        id: version
        run: |
          BUILD_NUMBER=$(( VERSION_CODE_OFFSET + ${{ github.run_number }} ))
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "versionCode: $BUILD_NUMBER"

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.DOCTOR_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::DOCTOR_ANDROID_KEYSTORE_BASE64 secret not found!"
            exit 1
          fi
          # Avoid echo mangling; strip whitespace/newlines from the secret.
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 --decode > composeApp/upload-keystore.jks
          if [ ! -s composeApp/upload-keystore.jks ]; then
            echo "::error::Decoded keystore is empty. Re-encode DOCTOR_ANDROID_KEYSTORE_BASE64."
            exit 1
          fi

      - name: Create keystore.properties
        env:
          STORE_PASSWORD: ${{ secrets.DOCTOR_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DOCTOR_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DOCTOR_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing DOCTOR_ANDROID_KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD secrets."
            exit 1
          fi
          # Write via Python so passwords with $, !, etc. are not shell-expanded.
          python3 - <<'PY'
          import os
          from pathlib import Path
          Path("keystore.properties").write_text(
              "storeFile=composeApp/upload-keystore.jks\n"
              f"storePassword={os.environ['STORE_PASSWORD']}\n"
              f"keyAlias={os.environ['KEY_ALIAS']}\n"
              f"keyPassword={os.environ['KEY_PASSWORD']}\n",
              encoding="utf-8",
          )
          PY

      - name: Verify keystore unlocks
        env:
          STORE_PASSWORD: ${{ secrets.DOCTOR_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DOCTOR_ANDROID_KEY_ALIAS }}
        run: |
          if ! keytool -list -keystore composeApp/upload-keystore.jks -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Cannot unlock keystore with DOCTOR_ANDROID_KEYSTORE_PASSWORD + DOCTOR_ANDROID_KEY_ALIAS."
            exit 1
          fi
          echo "Keystore unlock OK"

      - name: Build Android App Bundle
        run: ./gradlew :composeApp:bundleRelease -PversionBuild=${{ steps.version.outputs.build_number }} --no-daemon

      - name: Decode Google Play service account key
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64: ${{ secrets.DOCTOR_GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64 }}
        run: |
          if [ -z "$GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64" ]; then
            echo "::error::DOCTOR_GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64 secret not found!"
            exit 1
          fi
          echo "$GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64" | base64 --decode > google-play-service-account.json

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: google-play-service-account.json
          packageName: com.shifa.doc
          releaseFiles: composeApp/build/outputs/bundle/release/composeApp-release.aab
          track: ${{ inputs.track }}
          status: completed

      - name: Upload AAB artifact
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-release-${{ steps.version.outputs.build_number }}
          path: composeApp/build/outputs/bundle/release/composeApp-release.aab
          retention-days: 30

      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -f composeApp/upload-keystore.jks
          rm -f keystore.properties
          rm -f google-play-service-account.json

      - name: Failure Summary
        if: failure()
        run: |
          echo "Common issues: missing or invalid secrets, keystore signing, versionCode already used"
          echo "(raise VERSION_CODE_OFFSET), service account missing permissions."
