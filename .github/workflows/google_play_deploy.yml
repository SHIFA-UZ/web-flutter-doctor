name: Deploy Doctor App to Google Play

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip Flutter tests'
        required: false
        type: boolean
        default: false
      track:
        description: 'Play track'
        required: true
        type: choice
        options:
          - internal
          - beta
        default: internal

concurrency:
  group: doctor-play-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.35.5'
  JAVA_VERSION: '17'
  API_BASE_URL: 'https://shifa-doc-backend-mvp-production.up.railway.app'

jobs:
  build-and-deploy:
    name: Build & Deploy Shifa Doctor
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: ${{ env.JAVA_VERSION }}
          cache: gradle

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run tests
        if: ${{ !inputs.skip_tests }}
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Decode Firebase Android config
        env:
          FIREBASE_ANDROID_CONFIG_BASE64: ${{ secrets.DOCTOR_FIREBASE_ANDROID_CONFIG_BASE64 }}
        run: |
          if [ -z "$FIREBASE_ANDROID_CONFIG_BASE64" ]; then
            echo "::error::DOCTOR_FIREBASE_ANDROID_CONFIG_BASE64 secret not found!"
            exit 1
          fi
          echo "$FIREBASE_ANDROID_CONFIG_BASE64" | base64 --decode > android/app/google-services.json

      - name: Calculate version
        id: version
        run: |
          VERSION_NAME=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          BUILD_NUMBER=$(( 1 + ${{ github.run_number }} ))
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT

      - name: Decode Android keystore
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.DOCTOR_ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$ANDROID_KEYSTORE_BASE64" ]; then
            echo "::error::DOCTOR_ANDROID_KEYSTORE_BASE64 secret not found!"
            exit 1
          fi
          # Avoid echo mangling; strip whitespace/newlines from the secret.
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | tr -d '\r\n\t ' | base64 --decode > android/app/upload-keystore.jks
          if [ ! -s android/app/upload-keystore.jks ]; then
            echo "::error::Decoded keystore is empty. Re-encode DOCTOR_ANDROID_KEYSTORE_BASE64."
            exit 1
          fi

      - name: Create key.properties
        env:
          STORE_PASSWORD: ${{ secrets.DOCTOR_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DOCTOR_ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.DOCTOR_ANDROID_KEY_PASSWORD }}
        run: |
          if [ -z "$STORE_PASSWORD" ] || [ -z "$KEY_ALIAS" ] || [ -z "$KEY_PASSWORD" ]; then
            echo "::error::Missing DOCTOR_ANDROID_KEYSTORE_PASSWORD / KEY_ALIAS / KEY_PASSWORD secrets."
            exit 1
          fi
          # Write via Python so passwords with $, !, etc. are not shell-expanded.
          python3 - <<'PY'
          import os
          from pathlib import Path
          Path("android/key.properties").write_text(
              "storeFile=upload-keystore.jks\n"
              f"storePassword={os.environ['STORE_PASSWORD']}\n"
              f"keyAlias={os.environ['KEY_ALIAS']}\n"
              f"keyPassword={os.environ['KEY_PASSWORD']}\n",
              encoding="utf-8",
          )
          PY

      - name: Verify keystore unlocks
        env:
          STORE_PASSWORD: ${{ secrets.DOCTOR_ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.DOCTOR_ANDROID_KEY_ALIAS }}
        run: |
          if ! keytool -list \
            -keystore android/app/upload-keystore.jks \
            -storepass "$STORE_PASSWORD" \
            -alias "$KEY_ALIAS" >/dev/null 2>&1; then
            echo "::error::Cannot unlock keystore with DOCTOR_ANDROID_KEYSTORE_PASSWORD + DOCTOR_ANDROID_KEY_ALIAS."
            echo "Local check: keytool -list -keystore shifa-doc-upload-keystore.jks -alias YOUR_ALIAS"
            exit 1
          fi
          echo "Keystore unlock OK for alias=$KEY_ALIAS"

      - name: Build Android App Bundle
        run: |
          flutter build appbundle \
            --release \
            --dart-define=ENVIRONMENT=production \
            --dart-define=API_BASE_URL=${{ env.API_BASE_URL }} \
            --build-name=${{ steps.version.outputs.version_name }} \
            --build-number=${{ steps.version.outputs.build_number }}

      - name: Decode Google Play service account key
        env:
          GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64: ${{ secrets.DOCTOR_GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64 }}
        run: |
          echo "$GOOGLE_PLAY_SERVICE_ACCOUNT_BASE64" | base64 --decode > google-play-service-account.json

      - name: Upload to Google Play
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJson: google-play-service-account.json
          packageName: com.shifa.doc
          releaseFiles: build/app/outputs/bundle/release/app-release.aab
          track: ${{ inputs.track }}
          status: completed

      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -f android/app/google-services.json
          rm -f android/app/upload-keystore.jks
          rm -f android/key.properties
          rm -f google-play-service-account.json
