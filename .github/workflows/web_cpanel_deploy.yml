name: Deploy Doctor Web to cPanel

# WEB-09: the web app (Kotlin/Wasm) built and copied over FTPS (FTP with TLS) to the chosen site's folder on cPanel. Run
# by hand from the Actions tab; tests run on pull requests (ci.yml), not here. Replaces the Flutter app's Firebase Hosting
# deploy. FTPS rather than SSH: the host (ahost, de.ahost.cloud) doesn't open SSH to the outside.
#
# Repository secrets:
#   CPANEL_FTP_HOST      the cPanel server, de.ahost.cloud (its certificate is checked)
#   CPANEL_FTP_USER      one FTP account for both sites (cPanel → FTP Accounts), e.g. deploy@shifa.uz with directory
#                        doctor-web: the deploy can't reach anything outside it
#   CPANEL_FTP_PASSWORD  that account's password
#
# In that directory, production/ is the document root of doctor.shifa.uz and development/ that of doctor-dev.shifa.uz.
#
# Both sites get the same bundle: the web app opened at doctor-dev.shifa.uz talks to the development backend
# (isDevelopmentSite), everywhere else to production.
on:
  workflow_dispatch:
    inputs:
      site:
        description: Which site
        type: choice
        options: [production, development]
        default: production

# One deploy at a time per site, from any branch: they all write to the same folder.
# The jobs only read the repository; nothing here needs to write to it.
permissions:
  contents: read

concurrency:
  group: doctor-web-cpanel-${{ inputs.site }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy Shifa Doctor web
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The wasm link needs about 6 GB (CLAUDE.md "Web build"); the runner has 16 GB.
      - name: Build the web bundle
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --no-daemon -Pkotlin.daemon.jvmargs=-Xmx8g

      - name: Check the bundle
        run: |
          DIST=composeApp/build/dist/wasmJs/productionExecutable
          test -f "$DIST/index.html"
          test -f "$DIST/composeApp.js"
          test -f "$DIST/.htaccess"
          ls -la "$DIST" | head -40

      # The host's nginx (Engintron) serves .js files with its own 30-day cache, whatever .htaccess says. composeApp.js
      # keeps its name between builds and names the .wasm files of its own build, which the next deploy deletes; so
      # index.html (not cached) asks for it with this build's fingerprint, and a deploy reaches every browser at once.
      # It also names this build's .wasm files for preloading: a first visit downloads them (about 5 MB) alongside
      # composeApp.js instead of after it. `as="fetch" crossorigin` matches the requests composeApp.js makes.
      - name: Fingerprint the script
        run: |
          set -euo pipefail
          DIST=composeApp/build/dist/wasmJs/productionExecutable
          V=$(sha256sum "$DIST/composeApp.js" | cut -c1-12)
          PRELOAD=""
          for W in "$DIST"/*.wasm; do
            PRELOAD="$PRELOAD<link rel=\"preload\" href=\"$(basename "$W")\" as=\"fetch\" crossorigin>"
          done
          sed -i "s|<script type=\"module\" src=\"composeApp.js\"></script>|$PRELOAD<script type=\"module\" src=\"composeApp.js?v=$V\"></script>|" "$DIST/index.html"
          grep -q "src=\"composeApp.js?v=$V\"" "$DIST/index.html"
          test "$(grep -o 'rel="preload"' "$DIST/index.html" | wc -l)" -eq "$(ls "$DIST"/*.wasm | wc -l)"
          # Fonts, icons and strings keep their names too (and nginx lets browsers keep fonts and icons for 60 days):
          # the app adds this hash of all of them to their URLs (main.kt), so a changed font reaches every browser.
          R=$(cd "$DIST" && find composeResources -type f | sort | xargs sha256sum | sha256sum | cut -c1-12)
          sed -i "s|<html lang=\"en\">|<html lang=\"en\" data-resources=\"$R\">|" "$DIST/index.html"
          grep -q "data-resources=\"$R\"" "$DIST/index.html"

      # The code is about 22 MB and the host sends it as is: .htaccess sends these Brotli copies instead (about 5 MB).
      - name: Compress the code and strings
        run: |
          set -euo pipefail
          sudo apt-get update -qq && sudo apt-get install -y -qq brotli lftp
          find composeApp/build/dist/wasmJs/productionExecutable \( -name '*.wasm' -o -name '*.cvr' \) -exec brotli -q 11 {} +
          ls -la composeApp/build/dist/wasmJs/productionExecutable/*.br

      # --delete removes files of the previous build that this one no longer has. It only runs on a folder that is
      # empty or carries the marker an earlier deploy left, so an FTP account pointed at the wrong folder (home,
      # public_html) fails instead of being emptied. .well-known belongs to the host's automatic SSL (ahost: never
      # change or delete it): it doesn't count against an empty folder and the mirror leaves it alone.
      - name: Upload
        env:
          FTP_HOST: ${{ secrets.CPANEL_FTP_HOST }}
          SITE: ${{ inputs.site }}
          FTP_USER: ${{ secrets.CPANEL_FTP_USER }}
          LFTP_PASSWORD: ${{ secrets.CPANEL_FTP_PASSWORD }}
        run: |
          set -euo pipefail
          case "$SITE" in
            production | development) DIR="/$SITE" ;;
            *) echo "::error::Unknown site '$SITE'"; exit 1 ;;
          esac
          FTPS="set cmd:fail-exit true; set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate true; set net:max-retries 3; set net:timeout 30"
          # A failed login or listing stops here (set -e) rather than reading as an empty folder; so does a missing
          # folder (cPanel creates it with the domain's document root).
          RAW=$(lftp --env-password -u "$FTP_USER" -e "$FTPS; cd $DIR; cls -1a; bye" "$FTP_HOST")
          LISTING=$(printf '%s\n' "$RAW" | grep -vxE '(\.{1,2}|\.well-known)?/?' || true)
          if [ -n "$LISTING" ] && ! printf '%s\n' "$LISTING" | grep -qx '\.shifa-doctor-web'; then
            echo "::error::$DIR is neither empty nor an earlier Shifa Doctor deploy; nothing was changed."
            exit 1
          fi
          touch composeApp/build/dist/wasmJs/productionExecutable/.shifa-doctor-web
          lftp --env-password -u "$FTP_USER" \
            -e "$FTPS; mirror --reverse --delete --no-perms --parallel=4 --exclude '^\.well-known/' composeApp/build/dist/wasmJs/productionExecutable/ $DIR/; bye" \
            "$FTP_HOST"
