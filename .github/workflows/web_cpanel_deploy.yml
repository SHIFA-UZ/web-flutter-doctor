name: Deploy Doctor Web to cPanel

# WEB-09: the web app (Kotlin/Wasm) built and copied over SSH to the doctor site's folder on cPanel. Run by hand from the
# Actions tab; tests run on pull requests (ci.yml), not here. Replaces the Flutter app's Firebase Hosting deploy.
#
# Repository secrets:
#   CPANEL_SSH_HOST         the cPanel server's host name
#   CPANEL_SSH_PORT         its SSH port (cPanel often uses a non-standard one)
#   CPANEL_SSH_USER         the cPanel account user
#   CPANEL_SSH_PRIVATE_KEY  a private key whose public key is authorised in cPanel → SSH Access
#   CPANEL_DOCTOR_WEB_PATH  the site's folder on the server, e.g. /home/<user>/doctor.shifa.uz
on:
  workflow_dispatch:

# One deploy at a time from any branch: they all write to the same folder.
concurrency:
  group: doctor-web-cpanel
  cancel-in-progress: false

jobs:
  deploy:
    name: Build & deploy Shifa Doctor web
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: zulu
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # The wasm link needs about 6 GB (CLAUDE.md "Web build"); the runner has 16 GB.
      - name: Build the web bundle
        run: ./gradlew :composeApp:wasmJsBrowserDistribution --no-daemon -Pkotlin.daemon.jvmargs=-Xmx8g

      - name: Check the bundle
        run: |
          DIST=composeApp/build/dist/wasmJs/productionExecutable
          test -f "$DIST/index.html"
          test -f "$DIST/composeApp.js"
          test -f "$DIST/.htaccess"
          ls -la "$DIST" | head -40

      - name: Prepare SSH
        env:
          SSH_KEY: ${{ secrets.CPANEL_SSH_PRIVATE_KEY }}
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_KEY" > ~/.ssh/cpanel
          chmod 600 ~/.ssh/cpanel
          ssh-keyscan -p "$SSH_PORT" "$SSH_HOST" >> ~/.ssh/known_hosts 2>/dev/null

      # --delete removes files of the previous build that this one no longer has. It only runs on a folder that is
      # empty or carries the marker an earlier deploy left, so a wrong path (home, public_html) fails instead of
      # being emptied.
      - name: Upload
        env:
          SSH_HOST: ${{ secrets.CPANEL_SSH_HOST }}
          SSH_PORT: ${{ secrets.CPANEL_SSH_PORT }}
          SSH_USER: ${{ secrets.CPANEL_SSH_USER }}
          TARGET: ${{ secrets.CPANEL_DOCTOR_WEB_PATH }}
        run: |
          set -euo pipefail
          case "$TARGET" in
            /*) ;;
            *) echo "::error::CPANEL_DOCTOR_WEB_PATH must be an absolute path"; exit 1 ;;
          esac
          SSH="ssh -p $SSH_PORT -i $HOME/.ssh/cpanel"
          $SSH "$SSH_USER@$SSH_HOST" "mkdir -p '$TARGET' && cd '$TARGET' && { test -f .shifa-doctor-web || test -z \"\$(ls -A)\"; }" \
            || { echo "::error::The target folder is neither empty nor an earlier Shifa Doctor deploy; nothing was changed."; exit 1; }
          touch composeApp/build/dist/wasmJs/productionExecutable/.shifa-doctor-web
          rsync -az --delete -e "$SSH" \
            composeApp/build/dist/wasmJs/productionExecutable/ "$SSH_USER@$SSH_HOST:$TARGET/"

      - name: Remove the key
        if: always()
        run: rm -f ~/.ssh/cpanel
