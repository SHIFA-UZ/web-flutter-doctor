name: Deploy Doctor App to TestFlight

on:
  workflow_dispatch:
    inputs:
      skip_tests:
        description: 'Skip Flutter tests'
        required: false
        type: boolean
        default: false

concurrency:
  group: doctor-testflight-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.35.5'
  API_BASE_URL: 'https://shifa-doc-backend-mvp-production.up.railway.app'

jobs:
  build-and-deploy-ios:
    name: Build and Deploy Shifa Doctor iOS
    runs-on: macos-latest
    timeout-minutes: 40

    steps:
      - uses: actions/checkout@v4

      # Runs first, before the ~25 minute build, so a malformed key fails in
      # seconds instead of at the upload step.
      - name: Prepare App Store Connect API key
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          set -euo pipefail

          # GitHub stores secrets verbatim, so a stray newline from copy/paste
          # survives into the JWT `kid`/`iss` claims and Apple answers 401 —
          # indistinguishable from a wrong key, and invisible because the value
          # is masked in logs. Trim before anything else uses these.
          ASC_KEY_ID=$(printf '%s' "$API_KEY_ID" | tr -d '[:space:]')
          ASC_ISSUER_ID=$(printf '%s' "$API_ISSUER_ID" | tr -d '[:space:]')
          echo "::add-mask::$ASC_KEY_ID"
          echo "::add-mask::$ASC_ISSUER_ID"

          if [ "${#API_KEY_ID}" -ne "${#ASC_KEY_ID}" ]; then
            echo "::warning::APP_STORE_CONNECT_KEY_ID contained whitespace (trimmed)"
          fi
          if [ "${#API_ISSUER_ID}" -ne "${#ASC_ISSUER_ID}" ]; then
            echo "::warning::APP_STORE_CONNECT_ISSUER_ID contained whitespace (trimmed)"
          fi

          mkdir -p ~/private_keys
          ASC_P8_PATH="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          # Accept the secret either as raw PEM or base64-wrapped PEM.
          if printf '%s' "$API_KEY_CONTENT" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$API_KEY_CONTENT" > "$ASC_P8_PATH"
          else
            printf '%s' "$API_KEY_CONTENT" | tr -d '[:space:]' \
              | base64 --decode > "$ASC_P8_PATH"
          fi
          chmod 600 "$ASC_P8_PATH"

          if ! openssl pkey -in "$ASC_P8_PATH" -noout 2>/dev/null; then
            echo "::error::APP_STORE_CONNECT_API_KEY_P8 is not a valid private key."
            echo "Paste the whole AuthKey_<id>.p8 file including the BEGIN/END lines."
            exit 1
          fi
          echo "p8 public key sha256: $(openssl pkey -in "$ASC_P8_PATH" -pubout \
            -outform DER | shasum -a 256 | cut -d' ' -f1)"

          echo "ASC_KEY_ID=$ASC_KEY_ID" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID" >> "$GITHUB_ENV"

      - uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      # The selected Xcode already ships the iphoneos SDK, which is all a
      # --no-codesign device archive needs. Only fall back to -downloadPlatform
      # if it is genuinely missing, and never fail the job over it: that command
      # also installs the *simulator runtime*, which needs a CoreSimulator
      # handshake that hosted runners refuse ("Unable to connect to simulator").
      - name: Verify iOS platform SDK
        run: |
          set -uo pipefail
          echo "Installed iOS SDKs:"
          xcodebuild -showsdks | grep -i ios || true

          if xcodebuild -showsdks | grep -q 'sdk iphoneos'; then
            echo "iphoneos SDK present - nothing to download."
            exit 0
          fi

          echo "::warning::No iphoneos SDK found; attempting -downloadPlatform iOS"
          xcodebuild -downloadPlatform iOS || \
            echo "::warning::-downloadPlatform iOS failed; continuing"

          if ! xcodebuild -showsdks | grep -q 'sdk iphoneos'; then
            echo "::error::No iphoneos SDK available - device build cannot proceed."
            exit 1
          fi

      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true

      - name: Install Flutter dependencies
        run: flutter pub get

      - name: Run tests
        if: ${{ !inputs.skip_tests }}
        run: |
          flutter analyze --no-fatal-infos --no-fatal-warnings
          flutter test

      - name: Decode Firebase iOS config
        env:
          FIREBASE_IOS_CONFIG_BASE64: ${{ secrets.DOCTOR_FIREBASE_IOS_CONFIG_BASE64 }}
        run: |
          if [ -z "$FIREBASE_IOS_CONFIG_BASE64" ]; then
            echo "::error::DOCTOR_FIREBASE_IOS_CONFIG_BASE64 secret not found!"
            exit 1
          fi
          echo "$FIREBASE_IOS_CONFIG_BASE64" | base64 --decode > ios/Runner/GoogleService-Info.plist
          plutil -lint ios/Runner/GoogleService-Info.plist

      - name: Calculate version
        id: version
        run: |
          VERSION_NAME=$(grep '^version:' pubspec.yaml | sed 's/version: //' | cut -d'+' -f1)
          BUILD_NUMBER=$(( 1 + ${{ github.run_number }} ))
          echo "version_name=$VERSION_NAME" >> $GITHUB_OUTPUT
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT

      - name: Setup Ruby & cache gems (CocoaPods, Fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          working-directory: ios
          bundler-cache: true

      - name: Cache CocoaPods
        uses: actions/cache@v4
        with:
          path: ios/Pods
          key: doctor-pods-${{ hashFiles('ios/Podfile.lock') }}
          restore-keys: doctor-pods-

      - name: Install CocoaPods dependencies
        working-directory: ios
        run: bundle exec pod install

      - name: Import iOS Distribution Certificate
        env:
          CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE_P12" ]; then
            echo "::error::IOS_CERTIFICATE_P12_BASE64 secret not found!"
            exit 1
          fi

          CERT_DIR=$(mktemp -d)
          CERT_PATH="$CERT_DIR/certificate.p12"

          KEYCHAIN_NAME="ci-build.keychain-db"
          KEYCHAIN_PATH="$HOME/Library/Keychains/$KEYCHAIN_NAME"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo "$CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed s/\"//g)
          security default-keychain -s "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"
          rm -rf "$CERT_DIR"

      - name: Build iOS release (no codesign)
        run: |
          flutter build ios \
            --release \
            --no-codesign \
            --dart-define=ENVIRONMENT=production \
            --dart-define=API_BASE_URL=${{ env.API_BASE_URL }} \
            --build-name=${{ steps.version.outputs.version_name }} \
            --build-number=${{ steps.version.outputs.build_number }}

      - name: Build, Sign and Upload to TestFlight with Fastlane
        working-directory: ios
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ env.ASC_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ env.ASC_ISSUER_ID }}
          VERSION_NUMBER: ${{ steps.version.outputs.version_name }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
        run: bundle exec fastlane beta

      - name: Upload build logs (on failure)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-ios-logs-${{ steps.version.outputs.build_number }}
          path: |
            ios/build/logs/**/*
            ~/Library/Logs/gym/**/*
          retention-days: 7
          if-no-files-found: ignore

      - name: Cleanup sensitive files
        if: always()
        run: |
          rm -f ios/Runner/GoogleService-Info.plist
          rm -rf ~/private_keys

      - name: Deployment Summary
        if: success()
        run: |
          echo "============================================="
          echo "  iOS TestFlight Deployment Successful"
          echo "============================================="
          echo "  App: Shifa Doctor"
          echo "  Bundle ID: uz.shifa.doc"
          echo "  Version: ${{ steps.version.outputs.version_name }}"
          echo "  Build: ${{ steps.version.outputs.build_number }}"
          echo "============================================="
