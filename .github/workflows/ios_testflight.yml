name: Deploy Doctor App to TestFlight

# Tests run on pull requests (ci.yml), not here.
on:
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  # build number = offset + github.run_number. The Flutter app used 1 + run_number (last upload: run 5 =
  # build 6). Offset 4 makes the first KMP run (6) build 10, the same start as Android's versionCode.
  BUILD_NUMBER_OFFSET: 4

jobs:
  build-and-deploy-ios:
    name: Build and Deploy iOS to TestFlight
    # Intel, for its memory: the Kotlin/Native release link ran out of a 5 GB heap on the 7 GB Apple-silicon runner
    # (macos-latest), even on Kotlin 2.4.21; measured 2026-11-08, it keeps about 4.8 GB live and with a 6 GB heap did
    # nothing but collect garbage. The Intel runner has 14 GB and is free for this public repository too.
    # macos-15-intel is the last Intel image (supported until about August 2027).
    runs-on: macos-15-intel
    # Cap so a hung run doesn't burn hours. Intel is slower than Apple silicon: the link alone takes about 50 minutes.
    timeout-minutes: 120

    steps:
      #########################
      # PHASE 1: CHECKOUT & SETUP
      #########################

      - name: Checkout repository
        uses: actions/checkout@v4

      # Runs first, before the ~25 minute build, so a malformed key fails in
      # seconds instead of at the upload step.
      - name: Prepare App Store Connect API key
        env:
          API_KEY_ID: ${{ secrets.APP_STORE_CONNECT_KEY_ID }}
          API_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_ISSUER_ID }}
          API_KEY_CONTENT: ${{ secrets.APP_STORE_CONNECT_API_KEY_P8 }}
        run: |
          set -euo pipefail

          # GitHub stores secrets verbatim, so a stray newline from copy/paste
          # survives into the JWT `kid`/`iss` claims and Apple answers 401 —
          # indistinguishable from a wrong key, and invisible because the value
          # is masked in logs. Trim before anything else uses these.
          ASC_KEY_ID=$(printf '%s' "$API_KEY_ID" | tr -d '[:space:]')
          ASC_ISSUER_ID=$(printf '%s' "$API_ISSUER_ID" | tr -d '[:space:]')
          echo "::add-mask::$ASC_KEY_ID"
          echo "::add-mask::$ASC_ISSUER_ID"

          if [ "${#API_KEY_ID}" -ne "${#ASC_KEY_ID}" ]; then
            echo "::warning::APP_STORE_CONNECT_KEY_ID contained whitespace (trimmed)"
          fi
          if [ "${#API_ISSUER_ID}" -ne "${#ASC_ISSUER_ID}" ]; then
            echo "::warning::APP_STORE_CONNECT_ISSUER_ID contained whitespace (trimmed)"
          fi

          mkdir -p ~/private_keys
          ASC_P8_PATH="$HOME/private_keys/AuthKey_${ASC_KEY_ID}.p8"

          # Accept the secret either as raw PEM or base64-wrapped PEM.
          if printf '%s' "$API_KEY_CONTENT" | grep -q 'BEGIN PRIVATE KEY'; then
            printf '%s\n' "$API_KEY_CONTENT" > "$ASC_P8_PATH"
          else
            printf '%s' "$API_KEY_CONTENT" | tr -d '[:space:]' \
              | base64 --decode > "$ASC_P8_PATH"
          fi
          chmod 600 "$ASC_P8_PATH"

          if ! openssl pkey -in "$ASC_P8_PATH" -noout 2>/dev/null; then
            echo "::error::APP_STORE_CONNECT_API_KEY_P8 is not a valid private key."
            echo "Paste the whole AuthKey_<id>.p8 file including the BEGIN/END lines."
            exit 1
          fi
          echo "p8 public key sha256: $(openssl pkey -in "$ASC_P8_PATH" -pubout \
            -outform DER | shasum -a 256 | cut -d' ' -f1)"

          echo "ASC_KEY_ID=$ASC_KEY_ID" >> "$GITHUB_ENV"
          echo "ASC_ISSUER_ID=$ASC_ISSUER_ID" >> "$GITHUB_ENV"

      - name: Setup Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: '26.0'

      # Archiving for a device needs Xcode's iOS platform. The Intel image (macos-15-intel) ships it for Xcode 26.0.1
      # (iOS 26.0 SDK and runtime), and there `xcodebuild -downloadPlatform iOS` fails ("Unable to connect to
      # simulator"); so download only when it's missing, and fail loudly if it still is.
      - name: Check the iOS platform
        run: |
          set -euo pipefail
          if ! xcodebuild -showsdks | grep -q 'iphoneos'; then
            xcodebuild -downloadPlatform iOS
          fi
          xcodebuild -showsdks | grep 'iphoneos'

      # Xcode's "Compile Kotlin Framework" build phase runs Gradle.
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Cache Kotlin/Native toolchain
        uses: actions/cache@v4
        with:
          path: ~/.konan
          # The toolchain is per processor: runner.arch keeps the Intel copy apart from Apple silicon's (a cache key
          # is never overwritten, so without it the Intel runs could never save theirs).
          key: konan-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('gradle/libs.versions.toml') }}
          restore-keys: konan-${{ runner.os }}-${{ runner.arch }}-

      #########################
      # PHASE 2: FIREBASE CONFIGURATION
      #########################

      - name: Decode Firebase iOS config
        env:
          FIREBASE_IOS_CONFIG_BASE64: ${{ secrets.DOCTOR_FIREBASE_IOS_CONFIG_BASE64 }}
        run: |
          if [ -z "$FIREBASE_IOS_CONFIG_BASE64" ]; then
            echo "DOCTOR_FIREBASE_IOS_CONFIG_BASE64 secret not found!"
            exit 1
          fi
          echo "$FIREBASE_IOS_CONFIG_BASE64" | base64 --decode > iosApp/iosApp/GoogleService-Info.plist
          plutil -lint iosApp/iosApp/GoogleService-Info.plist

      #########################
      # PHASE 3: FASTLANE
      #########################

      - name: Setup Ruby & cache gems (Fastlane)
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: '3.2'
          working-directory: iosApp
          bundler-cache: true

      #########################
      # PHASE 4: VERSIONING
      #########################

      - name: Calculate version
        id: version
        run: |
          BUILD_NUMBER=$(( BUILD_NUMBER_OFFSET + ${{ github.run_number }} ))
          echo "build_number=$BUILD_NUMBER" >> $GITHUB_OUTPUT
          echo "Build: $BUILD_NUMBER"

      #########################
      # PHASE 5: CODE SIGNING SETUP
      #########################

      - name: Import iOS Distribution Certificate
        env:
          CERTIFICATE_P12: ${{ secrets.IOS_CERTIFICATE_P12_BASE64 }}
          CERTIFICATE_PASSWORD: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}
        run: |
          if [ -z "$CERTIFICATE_P12" ]; then
            echo "IOS_CERTIFICATE_P12_BASE64 secret not found!"
            exit 1
          fi

          CERT_DIR=$(mktemp -d)
          CERT_PATH="$CERT_DIR/certificate.p12"

          KEYCHAIN_NAME="ci-build.keychain-db"
          KEYCHAIN_PATH="$HOME/Library/Keychains/$KEYCHAIN_NAME"
          KEYCHAIN_PASSWORD=$(openssl rand -base64 32)

          echo "$CERTIFICATE_P12" | base64 --decode > "$CERT_PATH"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed s/\"//g)
          security default-keychain -s "$KEYCHAIN_PATH"

          security import "$CERT_PATH" \
            -k "$KEYCHAIN_PATH" \
            -P "$CERTIFICATE_PASSWORD" \
            -T /usr/bin/codesign \
            -T /usr/bin/security

          security set-key-partition-list \
            -S apple-tool:,apple: \
            -s \
            -k "$KEYCHAIN_PASSWORD" \
            "$KEYCHAIN_PATH"

          security find-identity -v -p codesigning "$KEYCHAIN_PATH"

          rm -rf "$CERT_DIR"

      #########################
      # PHASE 6: FASTLANE - BUILD, SIGN, ARCHIVE & UPLOAD
      #########################

      # The Kotlin framework is built once, by Xcode's "Compile Kotlin Framework" phase during the archive. (A separate
      # Gradle step before it was built again inside Xcode on CI, doubling an hour-long build.) That Gradle reads this
      # file, which overrides the project's gradle.properties: the release link needs more than 5 GB of heap; 10 GB
      # leaves 4 GB of the runner's 14 for the native tools and the system. Kotlin errors are in the uploaded build log.
      - name: Give the Kotlin build its memory
        run: |
          mkdir -p ~/.gradle
          echo 'org.gradle.jvmargs=-Xmx10g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8' >> ~/.gradle/gradle.properties

      - name: Build, Sign and Upload to TestFlight with Fastlane
        working-directory: iosApp
        env:
          APP_STORE_CONNECT_API_KEY_ID: ${{ env.ASC_KEY_ID }}
          APP_STORE_CONNECT_API_ISSUER_ID: ${{ env.ASC_ISSUER_ID }}
          BUILD_NUMBER: ${{ steps.version.outputs.build_number }}
          # gym first asks `xcodebuild -showBuildSettings`, by default for 3 s (doubling over 4 tries, 45 s in all).
          # On the Intel runner, right after resolving the Swift packages, that ran out (2026-11-08): 2 minutes, and
          # 4 more on one retry (each retry doubles the time).
          FASTLANE_XCODEBUILD_SETTINGS_TIMEOUT: '120'
          FASTLANE_XCODEBUILD_SETTINGS_RETRIES: '1'
        run: bundle exec fastlane beta

      #########################
      # PHASE 7: ARTIFACTS & CLEANUP
      #########################

      # Also when the time cap cancels the run: the log shows how far the build got.
      - name: Upload build logs (on failure)
        if: failure() || cancelled()
        uses: actions/upload-artifact@v4
        with:
          name: doctor-ios-logs-${{ steps.version.outputs.build_number }}
          path: |
            iosApp/build/logs/**/*
            ~/Library/Logs/gym/**/*
          retention-days: 7
          if-no-files-found: ignore

      - name: Cleanup sensitive files
        if: always()
        run: rm -rf ~/private_keys

      #########################
      # PHASE 8: SUMMARY
      #########################

      - name: Deployment Summary
        if: success()
        run: |
          echo "============================================="
          echo "  iOS TestFlight Deployment Successful"
          echo "============================================="
          echo "  Bundle ID: uz.shifa.doc"
          echo "  Build: ${{ steps.version.outputs.build_number }}"
          echo "  Branch: ${{ github.ref_name }}"
          echo "  Commit: ${{ github.sha }}"
          echo "  Apple processing: ~10-20 minutes"
          echo "============================================="

      - name: Failure Summary
        if: failure()
        run: |
          echo "============================================="
          echo "  iOS TestFlight Deployment FAILED"
          echo "============================================="
          echo "  Common issues:"
          echo "    - Missing or invalid secrets"
          echo "    - Code signing problems"
          echo "    - Build number already used (raise BUILD_NUMBER_OFFSET)"
          echo "============================================="
