# Quality gates
name: CI

# Every pull request (and by hand from the Actions tab): ktlint and unit tests on Linux, screenshot verification on
# macOS (the reference screenshots are recorded on macOS; Linux draws text slightly differently, so every comparison
# failed there). Standard runners, macOS included, cost nothing for this public repository.
on:
  pull_request:
  workflow_dispatch:

# The jobs only read the repository; nothing here needs to write to it.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint-test:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      - name: ktlint
        run: ./gradlew ktlintCheck --no-daemon

      - name: Unit tests
        run: ./gradlew :composeApp:testDebugUnitTest --no-daemon

      - name: Upload test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-results
          path: |
            composeApp/build/reports/tests/
            composeApp/build/test-results/
          if-no-files-found: ignore

  screenshots:
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4

      # Only the screenshot tests: the unit tests run in lint-test.
      - name: Screenshot verification
        run: ./gradlew :composeApp:verifyRoborazziDebug --no-daemon --tests '*ScreenshotTest'

      - name: Upload screenshot diffs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: screenshot-diffs
          path: |
            composeApp/build/outputs/roborazzi/
            composeApp/screenshots/*_compare.png
          if-no-files-found: ignore
