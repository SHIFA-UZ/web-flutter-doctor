<!doctype html>
<html lang="en">
<head>
    <meta charset="utf-8">
    <!-- The site is served from a domain root: any path (a bookmark, a reload) loads the same files. -->
    <base href="/">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Shifa Doctor</title>
    <link rel="icon" type="image/png" sizes="32x32" href="favicon.png">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
    <link rel="apple-touch-icon" href="apple-touch-icon.png">
    <meta name="theme-color" content="#00BBB0">
    <style>
        /* ShifaColors.Bg.Canvas until the app draws; the app scrolls itself, the page never does. */
        html, body { margin: 0; height: 100%; overflow: hidden; background: #F2F3F2; }
        #composeApp { width: 100%; height: 100%; }
        #composeApp canvas { display: block; } /* an inline canvas leaves a baseline gap that scrolls the page */
        /* While the app downloads: the splash's first frame (SplashScreen.kt, ShifaDimens.SplashBlob*), white under two
           teal blobs and the app icon in the centre. main() fades it out once the app draws the same frame. The icon
           breathes meanwhile, so a slow download doesn't look stuck. */
        #boot { position: fixed; inset: 0; z-index: 1; overflow: hidden; background: #FFFFFF; display: flex;
                align-items: center; justify-content: center; transition: opacity .25s; }
        /* An ellipse 941.6 x 644.1 (blob plus fade), turned 45°, its centre offset from the screen centre. */
        .blob { position: absolute; width: 941.56px; height: 644.08px; transform: rotate(45deg);
                background: radial-gradient(closest-side, rgba(0, 163, 154, .651) 89.38%,
                                            rgba(0, 163, 154, .325) 94.69%, rgba(0, 163, 154, 0) 100%); }
        .blob.a { left: calc(50% - 99.61px - 470.78px); top: calc(50% + 139.6px - 322.04px); }
        .blob.b { left: calc(50% - 10.16px - 470.78px); top: calc(50% - 233.16px - 322.04px); }
        #boot img { position: relative; width: 96px; height: 96px; animation: breathe 1.6s ease-in-out infinite alternate; }
        @keyframes breathe { to { opacity: .7; } }
        @media (prefers-reduced-motion: reduce) { #boot img { animation: none; } }
    </style>
    <!-- Phones of 3x and more draw at 2x: the app paints its whole canvas each frame, and 3x is 2.25 times the pixels of
         2x for text hardly anyone can tell apart. -->
    <script>if (window.devicePixelRatio > 2) Object.defineProperty(window, 'devicePixelRatio', { get: function () { return 2 } });</script>
    <!-- PUSH on the web: the app calls shifaPush.start once a doctor is signed in (the SDK loads only then). The Firebase
         web config and the Web Push key are public by design; firebase-messaging-sw.js repeats them. -->
    <script>
        window.shifaPush = (function () {
            var SDK = 'https://www.gstatic.com/firebasejs/13.1.0/';
            var CONFIG = {
                apiKey: 'AIzaSyB8q7D4Fp1a9rtHzNxTtPdhGlPG-0n56HM',
                authDomain: 'shifa-doctor-staging.firebaseapp.com',
                projectId: 'shifa-doctor-staging',
                storageBucket: 'shifa-doctor-staging.firebasestorage.app',
                messagingSenderId: '55173524197',
                appId: '1:55173524197:web:5db83dc4fe03cb3a92420c'
            };
            var VAPID = 'BADdv1OWqFIb_hOnX_3_synedY8DyZ9g8QhXczxoEOudCnKjYgfiaPtKjxQBD5RVhJoNjmeHoz3J_KrrANMoHIE';
            var supported = 'serviceWorker' in navigator && 'Notification' in window && 'PushManager' in window;
            var started = null;
            // Taps, kept until the app takes them: one the service worker posts to a tab that's still loading or at
            // Sign In, and the #push=… a tap opened the app with (then gone from the address).
            var taps = [], onTapped = null;
            function tap(json) { if (onTapped) onTapped(json); else taps.push(json); }
            if (supported) {
                navigator.serviceWorker.addEventListener('message', function (e) {
                    if (e.data && e.data.shifaPushTap) tap(JSON.stringify(e.data.shifaPushTap));
                });
            }
            var m = location.hash.match(/^#push=(.*)$/);
            if (m) {
                history.replaceState(history.state, '', location.pathname + location.search);
                try { tap(decodeURIComponent(m[1])); } catch (e) {}
            }
            // onToken(token or null), onReceived(json), onTapped(json): the app's side (Push).
            function start(onToken, onReceived, tapped) {
                if (!supported) return;
                onTapped = tapped;
                taps.splice(0).forEach(tapped);
                if (started) return started.then(function (token) { token(); });
                started = Promise.all([
                    // Ready: the worker is active before Firebase subscribes with it.
                    navigator.serviceWorker.register('/firebase-messaging-sw.js').then(function () {
                        return navigator.serviceWorker.ready;
                    }),
                    import(SDK + 'firebase-app.js'),
                    import(SDK + 'firebase-messaging.js')
                ]).then(function (r) {
                    var reg = r[0], fm = r[2], messaging = fm.getMessaging(r[1].initializeApp(CONFIG));
                    // The tab is open: the app refreshes, and the push shows as on a phone.
                    fm.onMessage(messaging, function (p) {
                        var data = p.data || {}, n = p.notification || {};
                        onReceived(JSON.stringify(data));
                        if (n.title || n.body) {
                            reg.showNotification(n.title || '', {
                                body: n.body || '', icon: '/icon-192.png', tag: data.notificationId || undefined,
                                data: { shifaPushTap: data }
                            });
                        }
                    });
                    function token() {
                        if (Notification.permission !== 'granted') return;
                        fm.getToken(messaging, { vapidKey: VAPID, serviceWorkerRegistration: reg })
                            .then(onToken, function () { onToken(null); });
                    }
                    if (Notification.permission === 'default') {
                        // Browsers only ask after a click or a key: the doctor's, until they answer.
                        var ask = function () {
                            Notification.requestPermission().then(function (p) {
                                if (p === 'default') return;
                                document.removeEventListener('click', ask, true);
                                document.removeEventListener('keydown', ask, true);
                                token();
                            });
                        };
                        document.addEventListener('click', ask, true);
                        document.addEventListener('keydown', ask, true);
                    }
                    token();
                    return token;
                }, function () {
                    started = null; // a failed load (offline, blocked) is tried again on the next start
                    return function () {};
                });
                return started;
            }
            return { start: start };
        })();
    </script>
    <!-- A module: since Kotlin 2.4 the production bundle contains import.meta, which a classic script can't parse
         (a blank page). Modules also run after the body is parsed. -->
    <script type="module" src="composeApp.js"></script>
</head>
<body>
<div id="composeApp"></div>
<div id="boot"><div class="blob a"></div><div class="blob b"></div><img src="icon-192.png" alt=""></div>
</body>
</html>
