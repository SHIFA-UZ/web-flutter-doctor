#Kotlin
kotlin.code.style=official
# The wasm link of the web build needs about 6 GB (runs out at 4 GB). ~/.gradle/gradle.properties overrides this.
kotlin.daemon.jvmargs=-Xmx8g

#Gradle
# Kotlin/Native release links of the iOS framework run out of heap at 4 GB (TestFlight CI).
org.gradle.jvmargs=-Xmx6g -Dfile.encoding=UTF-8
org.gradle.configuration-cache=true
org.gradle.caching=true

#Android
android.nonTransitiveRClass=true
android.useAndroidX=true