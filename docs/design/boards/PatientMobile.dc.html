<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Patient Record — Phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.pm-btn:focus-visible{outline:2px solid #00bbb0;outline-offset:2px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #f2f3f2; color: #272727; font-family: Manrope, system-ui, sans-serif">
  <header style="position: absolute; top: 0; left: 0; right: 0; height: 100px; box-sizing: border-box; background: #ffffff; padding: 36px 16px 0; display: flex; align-items: center; gap: 8px; z-index: 2">
    <a href="PatientsMobile.dc.html" aria-label="Back to Patients" style="width: 44px; height: 44px; border-radius: 999px; background: #f2f3f2; color: #272727; display: inline-flex; align-items: center; justify-content: center; flex: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"></path></svg>
    </a>
    <h1 style="margin: 0; flex: 1 1 auto; text-align: center; font-size: 16px; line-height: 22px; font-weight: 700; letter-spacing: -1px; padding-right: 52px">Patient</h1>
  </header>
  <main style="position: absolute; top: 100px; left: 0; right: 0; bottom: 0; overflow-y: auto; box-sizing: border-box; padding: 16px 16px 140px; display: flex; flex-direction: column; gap: 16px">
    <dc-import name="PatientHeader" layout="phone" on-delete="{{askDelete}}" hint-size="100%,470px"></dc-import>
    <h2 style="margin: 8px 0 0; font-size: 20px; line-height: 22px; font-weight: 700; letter-spacing: -1px">Needs Attention</h2>
    <dc-import name="Insight" kind="risk" hint-size="100%,200px"></dc-import>
    <h2 style="margin: 8px 0 0; font-size: 20px; line-height: 22px; font-weight: 700; letter-spacing: -1px">Recent Documents</h2>
    <ul style="list-style: none; margin: 0; padding: 8px; background: #ffffff; border-radius: 16px; display: flex; flex-direction: column; gap: 4px">
      <li style="display: flex; align-items: center; gap: 12px; padding: 8px">
        <span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 10px; background: #f2f3f2; color: #494d4c; display: inline-flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6"></path></svg></span>
        <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 14px; line-height: 16px; font-weight: 700">Blood test results, 18 October</span><span style="font-size: 12px; line-height: 12px; font-weight: 500; color: #7d8282">PDF · 18 Oct 2026</span></span>
        <button class="pm-btn" onClick="{{askDeleteDoc}}" aria-label="Delete Blood test results, 18 October" style="width: 44px; height: 44px; border: 0; border-radius: 999px; background: transparent; color: #494d4c; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6M10 11v6M14 11v6M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg></button>
      </li>
      <li style="display: flex; align-items: center; gap: 12px; padding: 8px">
        <span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 10px; background: #f2f3f2; color: #494d4c; display: inline-flex; align-items: center; justify-content: center; flex: none"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path><path d="M14 2v6h6"></path></svg></span>
        <span style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px"><span style="font-size: 14px; line-height: 16px; font-weight: 700">Chest X-ray report</span><span style="font-size: 12px; line-height: 12px; font-weight: 500; color: #7d8282">PDF · 18 Oct 2026</span></span>
      </li>
    </ul>
  </main>
  <button class="pm-btn" onClick="{{openCopilot}}" aria-label="Ask Shifa AI about Jasur Tursunov" style="position: absolute; right: 24px; bottom: 112px; z-index: 3; width: 56px; height: 56px; border: 0; border-radius: 999px; background: #00bbb0; box-shadow: 0 0 0 6px #00bbb040, 0 0 16px #00000026; color: #ffffff; display: inline-flex; align-items: center; justify-content: center; cursor: pointer">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"></path><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"></path></svg>
  </button>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 3">
    <dc-import name="NavBar" active="patients" hint-size="100%,104px"></dc-import>
  </div>
  <sc-if value="{{anyTray}}" hint-placeholder-val="{{ false }}">
    <button aria-label="Close" onClick="{{closeTray}}" style="position: absolute; inset: 0; z-index: 10; border: 0; background: #00000080; cursor: pointer"></button>
  </sc-if>
  <sc-if value="{{trayCopilot}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 0; right: 0; top: 48px; bottom: 0; z-index: 11">
      <dc-import name="Copilot" layout="tray" scope="Jasur Tursunov" tray-height="796px" on-collapse="{{closeTray}}" hint-size="100%,796px"></dc-import>
    </div>
  </sc-if>
  <sc-if value="{{trayDoc}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 11">
      <dc-import name="Dialog" layout="phone" kind="destructive" on-close="{{closeTray}}" on-confirm="{{closeTray}}" hint-size="100%,380px"></dc-import>
    </div>
  </sc-if>
  <sc-if value="{{trayPatient}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 11">
      <dc-import name="Dialog" layout="phone" kind="destructive" title="Delete Jasur Tursunov?" body="His record, visits and documents will be removed from your clinic. This can’t be undone." confirm-label="Delete Patient" on-close="{{closeTray}}" on-confirm="{{closeTray}}" hint-size="100%,380px"></dc-import>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tray: null }; }
  renderVals() {
    const t = this.state.tray;
    return {
      anyTray: !!t, trayCopilot: t === 'copilot', trayDoc: t === 'doc', trayPatient: t === 'patient',
      openCopilot: () => this.setState({ tray: 'copilot' }),
      askDelete: () => this.setState({ tray: 'patient' }),
      askDeleteDoc: () => this.setState({ tray: 'doc' }),
      closeTray: () => this.setState({ tray: null })
    };
  }
}
</script>
</body>
</html>
