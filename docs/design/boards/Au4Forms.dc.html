<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>FormSection, MapPicker</title>
<script src="./support.js"></script>
<link rel="stylesheet" href="shifa-ds.css">
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.au-frame{container-type:inline-size;box-sizing:content-box}
.au-frame h3,.au-frame h4,.au-frame p{margin-top:0}
</style>
</helmet>
<div style="width: 2698px; min-height: 1570px; box-sizing: border-box; padding: 48px; background: var(--bg-surface); color: var(--text-primary); font-family: var(--font-sans); display: flex; flex-direction: column; gap: 32px">
<header style="display: flex; flex-direction: column; gap: 8px; max-width: 1600px">
<p style="margin: 0; font: 700 14px/20px var(--font-sans); letter-spacing: .04em; text-transform: uppercase; color: var(--text-tertiary)">Audit_4.11 · 18 · Forms</p>
<h1 style="margin: 0; font: 700 40px/44px var(--font-sans); letter-spacing: -1px">FormSection, MapPicker</h1>
<p style="margin: 0; font: 500 18px/26px var(--font-sans); color: var(--text-secondary)">Settings and profile forms, and choosing an address.</p>
</header>
<div style="display: flex; gap: 48px; align-items: flex-start">
<sc-for list="{{frames}}" as="f" hint-placeholder-count="3">
<section style="flex: none; width: {{f.pw}}px; display: flex; flex-direction: column; gap: 12px">
<div style="display: flex; align-items: baseline; gap: 12px; padding: 0 4px">
<h2 style="margin: 0; font: 700 22px/28px var(--font-sans); letter-spacing: -.5px">{{f.label}}</h2>
<span style="font: 500 14px/20px var(--font-sans); color: var(--text-tertiary)">{{f.sub}}</span>
</div>
<div style="background: var(--bg-canvas); border-radius: 20px; padding: 16px">
<div class="dr-frame au-frame" style="width: {{f.cw}}px">
<div style="display:flex;flex-direction:column;gap:20px"><section class="dr-form"><div class="dr-form__head"><div class="dr-grow"><h3 class="dr-form__title">Clinic address</h3><p class="dr-form__desc">Shown to patients on your booking page.</p></div></div><div class="dr-form__grid"><label class="sh-field "><span class="sh-field__box"><span class="sh-field__text"><span class="sh-field__label">Clinic name</span><input class="sh-field__input" value="Shifa Clinic · Yunusobod"></span></span><span class="sh-field__help"></span></label><div class="dr-phone"><span class="dr-cc">+998 <svg class="sh-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 9l6 6 6-6"></path></svg></span><label class="sh-field dr-grow"><span class="sh-field__box"><span class="sh-field__text"><span class="sh-field__label">Phone</span><input class="sh-field__input" value="71 200 45 67"></span></span><span class="sh-field__help"></span></label></div><label class="sh-field is-wide"><span class="sh-field__box"><span class="sh-field__text"><span class="sh-field__label">Street and building</span><input class="sh-field__input" value="Amir Temur ko‘chasi, 108"></span></span><span class="sh-field__help"></span></label><select class="sh-select" aria-label="District"><option>Yunusobod district</option></select><label class="dr-check"><span class="dr-box is-on"><svg class="sh-icon" width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 6L9 17l-5-5"></path></svg></span>Wheelchair access</label></div><div class="dr-form__foot"><button class="sh-btn sh-btn--secondary sh-btn--compact">Cancel</button><button class="sh-btn sh-btn--primary sh-btn--compact">Save Address</button></div></section><div class="dr-map"><div class="dr-map__grid"></div><div class="dr-map__search"><label class="sh-search"><svg class="sh-icon sh-search__glass" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="M21 21l-4.35-4.35"></path></svg><input class="sh-search__input" placeholder="Search address" aria-label="Search address"></label></div><span class="dr-map__pin"><svg class="sh-icon" width="40" height="40" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M21 10c0 7-9 13-9 13S3 17 3 10a9 9 0 0 1 18 0z"></path><circle cx="12" cy="10" r="3"></circle></svg></span><div class="dr-map__sheet"><div class="dr-grow"><b style="display:block;font:700 14px/18px var(--font-sans)">Amir Temur ko‘chasi, 108</b><span style="font:500 12px/16px var(--font-sans);color:var(--text-secondary)">Yunusobod, Tashkent</span></div><button class="sh-btn sh-btn--primary sh-btn--compact">Use This Address</button></div></div></div>
</div>
</div>
</section>
</sc-for>
</div>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2698,"height":1570}}'>
class Component extends DCLogic {
  renderVals() {
    const F = [["d", "Desktop web", "1440 viewport · sidebar 260 · content 1132", 1132], ["t", "Tablet", "1024 viewport · rail 72 · content 920", 920], ["p", "Phone", "390 viewport · 16 gutters · content 358", 358]];
    return { frames: F.map((f) => ({ k: f[0], label: f[1], sub: f[2], cw: f[3], pw: f[3] + 32, isD: f[0] === 'd', isT: f[0] === 't', isP: f[0] === 'p', rail: f[0] === 't' ? 'dr-shell--rail' : '' })) };
  }
}
</script>
</body>
</html>
