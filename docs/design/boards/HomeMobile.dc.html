<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home — Phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.hm-btn:focus-visible{outline:2px solid #00bbb0;outline-offset:2px}
.hm-row:hover{background:#0000000d !important}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #f2f3f2; color: #272727; font-family: Manrope, system-ui, sans-serif">
  <header style="position: absolute; top: 0; left: 0; right: 0; height: 100px; box-sizing: border-box; background: #ffffff; padding: 40px 16px 12px; display: flex; align-items: center; gap: 12px; z-index: 2">
    <span aria-hidden="true" style="width: 40px; height: 40px; border-radius: 999px; background: #f2f3f2; font-size: 14px; font-weight: 700; display: inline-flex; align-items: center; justify-content: center; flex: none">NK</span>
    <div style="flex: 1 1 auto; min-width: 0; display: flex; flex-direction: column; gap: 4px">
      <span style="font-size: 12px; line-height: 12px; font-weight: 500; color: #494d4c">Sunday, 25 October</span>
      <h1 style="margin: 0; font-size: 20px; line-height: 22px; font-weight: 700; letter-spacing: -1px">Good morning, Dr. Karimova</h1>
    </div>
    <button class="hm-btn" aria-label="Notifications, 2 unread" style="position: relative; width: 44px; height: 44px; border: 0; border-radius: 999px; background: #f2f3f2; color: #272727; display: inline-flex; align-items: center; justify-content: center; cursor: pointer; flex: none">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path><path d="M13.73 21a2 2 0 0 1-3.46 0"></path></svg>
      <span style="position: absolute; top: 4px; right: 4px; min-width: 16px; height: 16px; border-radius: 999px; background: #00bbb0; color: #ffffff; font-size: 10px; line-height: 16px; font-weight: 700">2</span>
    </button>
  </header>
  <main style="position: absolute; top: 100px; left: 0; right: 0; bottom: 0; overflow-y: auto; box-sizing: border-box; padding: 16px 16px 140px; display: flex; flex-direction: column; gap: 16px">
    <dc-import name="Hero" layout="phone" briefing="{{briefing}}" started="{{started}}" on-briefing="{{openBriefing}}" on-start="{{start}}" hint-size="100%,300px"></dc-import>
    <div style="display: flex; align-items: baseline; justify-content: space-between; padding-top: 8px">
      <h2 style="margin: 0; font-size: 20px; line-height: 22px; font-weight: 700; letter-spacing: -1px">Today's Schedule</h2>
      <span style="font-size: 12px; line-height: 16px; font-weight: 500; color: #494d4c">5 appointments</span>
    </div>
    <dc-import name="Timeline" layout="phone" started="{{started}}" on-start="{{start}}" hint-size="100%,700px"></dc-import>
    <h2 style="margin: 8px 0 0; font-size: 20px; line-height: 22px; font-weight: 700; letter-spacing: -1px">Needs Attention</h2>
    <dc-import name="Insight" kind="risk" hint-size="100%,200px"></dc-import>
    <dc-import name="Insight" kind="suggestion" hint-size="100%,220px"></dc-import>
  </main>
  <button class="hm-btn" onClick="{{openCopilot}}" aria-label="Ask Shifa AI" style="position: absolute; right: 24px; bottom: 112px; z-index: 3; width: 56px; height: 56px; border: 0; border-radius: 999px; background: #00bbb0; box-shadow: 0 0 0 6px #00bbb040, 0 0 16px #00000026; color: #ffffff; display: inline-flex; align-items: center; justify-content: center; cursor: pointer">
    <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 3l1.9 5.1L19 10l-5.1 1.9L12 17l-1.9-5.1L5 10l5.1-1.9z"></path><path d="M19 15l.8 2.2L22 18l-2.2.8L19 21l-.8-2.2L16 18l2.2-.8z"></path></svg>
  </button>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 3">
    <dc-import name="NavBar" active="home" on-more="{{openMore}}" hint-size="100%,104px"></dc-import>
  </div>

  <sc-if value="{{anyTray}}" hint-placeholder-val="{{ false }}">
    <button aria-label="Close" onClick="{{closeTray}}" style="position: absolute; inset: 0; z-index: 10; border: 0; background: #00000080; cursor: pointer"></button>
  </sc-if>
  <sc-if value="{{trayCopilot}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 0; right: 0; top: 48px; bottom: 0; z-index: 11">
      <dc-import name="Copilot" layout="tray" scope="All patients" tray-height="796px" on-collapse="{{closeTray}}" hint-size="100%,796px"></dc-import>
    </div>
  </sc-if>
  <sc-if value="{{trayBriefing}}" hint-placeholder-val="{{ false }}">
    <div style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 11">
      <dc-import name="Dialog" layout="phone" kind="briefing" on-close="{{closeTray}}" on-confirm="{{start}}" hint-size="100%,460px"></dc-import>
    </div>
  </sc-if>
  <sc-if value="{{trayMore}}" hint-placeholder-val="{{ false }}">
    <section aria-label="More" style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 11; background: #ffffff; border-radius: 24px 24px 0 0; box-shadow: 0 0 26px #00000066; padding: 8px 16px 32px; display: flex; flex-direction: column; gap: 8px">
      <span aria-hidden="true" style="display: block; width: 36px; height: 4px; border-radius: 999px; background: #e8e8e8; margin: 0 auto 8px"></span>
      <div style="display: flex; align-items: center; justify-content: space-between">
        <h2 style="margin: 0; font-size: 16px; line-height: 22px; font-weight: 700; letter-spacing: -1px">More</h2>
        <button class="hm-btn" onClick="{{closeTray}}" aria-label="Close" style="width: 36px; height: 36px; border: 0; border-radius: 999px; background: #f2f3f2; color: #494d4c; display: inline-flex; align-items: center; justify-content: center; cursor: pointer"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M18 6L6 18M6 6l12 12"></path></svg></button>
      </div>
      <ul style="list-style: none; margin: 0; padding: 0; display: flex; flex-direction: column">
        <sc-for list="{{moreItems}}" as="m" hint-placeholder-count="6">
          <li><button class="hm-row hm-btn" style="width: 100%; height: 52px; border: 0; border-radius: 10px; background: transparent; color: #272727; display: flex; align-items: center; gap: 12px; padding: 0 8px; font: 500 14px/20px Manrope, system-ui, sans-serif; cursor: pointer; text-align: left">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="{{m.d}}"></path></svg>
            <span style="flex: 1 1 auto">{{m.label}}</span>
            <sc-if value="{{m.hasCount}}" hint-placeholder-val="{{ false }}"><span style="min-width: 20px; height: 20px; border-radius: 999px; background: #00bbb0; color: #ffffff; font-size: 10px; line-height: 20px; font-weight: 700; text-align: center; padding: 0 6px; box-sizing: border-box">{{m.count}}</span></sc-if>
            <span style="display: inline-flex; color: #494d4c"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"></path></svg></span>
          </button></li>
        </sc-for>
      </ul>
    </section>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { tray: null, briefing: 'idle', started: false }; }
  componentWillUnmount() { clearTimeout(this.t); }
  renderVals() {
    const t = this.state.tray;
    const more = [
      ['Tasks', 'M9 11l3 3L22 4M21 12v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11', 5],
      ['Clinic', 'M3 21h18M5 21V7l7-4 7 4v14M10 9h4M12 7v4M9 21v-5h6v5', 0],
      ['Notifications', 'M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9M13.73 21a2 2 0 0 1-3.46 0', 2],
      ['Reports', 'M12 20V10M18 20V4M6 20v-4', 0],
      ['Finance', 'M3 4h18a2 2 0 0 1 2 2v12a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2zM1 10h22', 0],
      ['Settings', 'M4 21v-7M4 10V3M12 21v-9M12 8V3M20 21v-5M20 12V3M1 14h6M9 8h6M17 16h6', 0]
    ].map(([label, d, count]) => ({ label, d, count, hasCount: count > 0 }));
    return {
      briefing: this.state.briefing, started: this.state.started,
      anyTray: !!t, trayCopilot: t === 'copilot', trayMore: t === 'more', trayBriefing: t === 'briefing',
      moreItems: more,
      openCopilot: () => this.setState({ tray: 'copilot' }),
      openMore: () => this.setState({ tray: 'more' }),
      closeTray: () => this.setState({ tray: null }),
      start: () => this.setState({ started: true, tray: null }),
      openBriefing: () => {
        if (this.state.briefing === 'ready') { this.setState({ tray: 'briefing' }); return; }
        if (this.state.briefing === 'loading') return;
        this.setState({ briefing: 'loading' });
        this.t = setTimeout(() => this.setState({ briefing: 'ready', tray: 'briefing' }), 1400);
      }
    };
  }
}
</script>
</body>
</html>
