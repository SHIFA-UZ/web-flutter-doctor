<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>AiCopilot states</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 2000px; height: 960px; box-sizing: border-box; padding: 40px; background: #f2f3f2; color: #272727; font-family: Manrope, system-ui, sans-serif; display: flex; gap: 20px; align-items: flex-start">
  <figure style="margin: 0; width: 360px; display: flex; flex-direction: column; gap: 10px">
    <figcaption style="font-size: 12px; line-height: 16px; font-weight: 700; color: #494d4c">Docked · empty, suggestions ready</figcaption>
    <dc-import name="Copilot" layout="docked" scope="All patients" preset="empty" hint-size="100%,560px"></dc-import>
  </figure>
  <figure style="margin: 0; width: 360px; display: flex; flex-direction: column; gap: 10px">
    <figcaption style="font-size: 12px; line-height: 16px; font-weight: 700; color: #494d4c">Docked · streaming</figcaption>
    <dc-import name="Copilot" layout="docked" scope="All patients" preset="streaming" hint-size="100%,560px"></dc-import>
  </figure>
  <figure style="margin: 0; width: 360px; display: flex; flex-direction: column; gap: 10px">
    <figcaption style="font-size: 12px; line-height: 16px; font-weight: 700; color: #494d4c">Docked · answered, patient scope</figcaption>
    <dc-import name="Copilot" layout="docked" scope="Jasur Tursunov" preset="answered" hint-size="100%,680px"></dc-import>
  </figure>
  <figure style="margin: 0; width: 360px; display: flex; flex-direction: column; gap: 10px">
    <figcaption style="font-size: 12px; line-height: 16px; font-weight: 700; color: #494d4c">Minimised · the orb; tap to reopen</figcaption>
    <div style="height: 200px; border-radius: 16px; border: 1px dashed #979b9b; display: flex; align-items: flex-end; justify-content: flex-end">
      <dc-import name="Copilot" layout="docked" preset="minimised" hint-size="100%,88px"></dc-import>
    </div>
  </figure>
  <figure style="margin: 0; width: 390px; display: flex; flex-direction: column; gap: 10px">
    <figcaption style="font-size: 12px; line-height: 16px; font-weight: 700; color: #494d4c">Phone · full-height tray</figcaption>
    <div style="position: relative; width: 390px; height: 840px; border-radius: 16px; overflow: hidden; background: #f2f3f2">
      <div style="position: absolute; inset: 0; background: #00000080"></div>
      <div style="position: absolute; left: 0; right: 0; top: 48px; bottom: 0">
        <dc-import name="Copilot" layout="tray" scope="All patients" preset="answered" tray-height="792px" hint-size="100%,792px"></dc-import>
      </div>
    </div>
  </figure>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2000,"height":960}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
