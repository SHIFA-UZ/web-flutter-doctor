<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Patients — Phone</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
.pp-btn:focus-visible{outline:2px solid #00bbb0;outline-offset:2px}
</style>
</helmet>
<div style="position: relative; width: 390px; height: 844px; overflow: hidden; background: #f2f3f2; color: #272727; font-family: Manrope, system-ui, sans-serif">
  <header style="position: absolute; top: 0; left: 0; right: 0; height: 100px; box-sizing: border-box; background: #ffffff; padding: 40px 16px 12px; display: flex; align-items: center; gap: 12px; z-index: 2">
    <h1 style="margin: 0; flex: 1 1 auto; font-size: 32px; line-height: 40px; font-weight: 700; letter-spacing: -1px">Patients</h1>
    <button class="pp-btn" onClick="{{openAdd}}" aria-label="Add Patient" style="width: 44px; height: 44px; border: 0; border-radius: 999px; background: #00bbb0; color: #ffffff; box-shadow: 0 0 16px #00000026; display: inline-flex; align-items: center; justify-content: center; cursor: pointer">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"></path></svg>
    </button>
  </header>
  <main style="position: absolute; top: 100px; left: 0; right: 0; bottom: 0; overflow-y: auto; box-sizing: border-box; padding: 16px 16px 140px">
    <dc-import name="Table" layout="phone" hint-size="100%,1100px"></dc-import>
  </main>
  <div style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 3">
    <dc-import name="NavBar" active="patients" hint-size="100%,104px"></dc-import>
  </div>
  <sc-if value="{{adding}}" hint-placeholder-val="{{ false }}">
    <button aria-label="Cancel" onClick="{{close}}" style="position: absolute; inset: 0; z-index: 10; border: 0; background: #00000080; cursor: pointer"></button>
    <div style="position: absolute; left: 0; right: 0; bottom: 0; z-index: 11">
      <dc-import name="Dialog" layout="phone" kind="form" on-close="{{close}}" on-confirm="{{close}}" hint-size="100%,560px"></dc-import>
    </div>
  </sc-if>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  constructor(props) { super(props); this.state = { adding: false }; }
  renderVals() {
    return {
      adding: this.state.adding,
      openAdd: () => this.setState({ adding: true }),
      close: () => this.setState({ adding: false })
    };
  }
}
</script>
</body>
</html>
