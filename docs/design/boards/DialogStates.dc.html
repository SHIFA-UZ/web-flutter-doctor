<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>ResponsiveDialog states</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&amp;display=swap" rel="stylesheet">
<style>body{margin:0}</style>
</helmet>
<div style="width: 2000px; height: 1000px; box-sizing: border-box; padding: 40px; background: #f2f3f2; color: #272727; font-family: Manrope, system-ui, sans-serif; display: flex; gap: 24px; align-items: flex-start">
  <div style="width: 520px; display: flex; flex-direction: column; gap: 32px">
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px">
      <figcaption style="font-size: 12px; line-height: 16px; font-weight: 700; color: #494d4c">Web · destructive: tone disc, verb on the button, primary last</figcaption>
      <div style="height: 340px; border-radius: 16px; background: #00000080; display: flex; align-items: center; justify-content: center; padding: 20px">
        <div style="width: 100%; max-width: 480px"><dc-import name="Dialog" layout="web" kind="destructive" hint-size="100%,290px"></dc-import></div>
      </div>
    </figure>
    <figure style="margin: 0; display: flex; flex-direction: column; gap: 10px">
      <figcaption style="font-size: 12px; line-height: 16px; font-weight: 700; color: #494d4c">Web · AI briefing (opened from NextPatientHero)</figcaption>
      <div style="height: 480px; border-radius: 16px; background: #00000080; display: flex; align-items: center; justify-content: center; padding: 20px">
        <div style="width: 100%; max-width: 480px"><dc-import name="Dialog" layout="web" kind="briefing" hint-size="100%,420px"></dc-import></div>
      </div>
    </figure>
  </div>
  <figure style="margin: 0; width: 520px; display: flex; flex-direction: column; gap: 10px">
    <figcaption style="font-size: 12px; line-height: 16px; font-weight: 700; color: #494d4c">Web · form: body scrolls, actions stay put; focus ring on the first field</figcaption>
    <div style="height: 600px; border-radius: 16px; background: #00000080; display: flex; align-items: center; justify-content: center; padding: 20px">
      <div style="width: 100%; max-width: 480px"><dc-import name="Dialog" layout="web" kind="form" hint-size="100%,480px"></dc-import></div>
    </div>
  </figure>
  <figure style="margin: 0; width: 390px; display: flex; flex-direction: column; gap: 10px">
    <figcaption style="font-size: 12px; line-height: 16px; font-weight: 700; color: #494d4c">Phone · docks as a tray, buttons stacked, primary on top</figcaption>
    <div style="position: relative; width: 390px; height: 560px; border-radius: 16px; overflow: hidden; background: #00000080">
      <div style="position: absolute; left: 0; right: 0; bottom: 0"><dc-import name="Dialog" layout="phone" kind="destructive" hint-size="100%,380px"></dc-import></div>
    </div>
  </figure>
  <figure style="margin: 0; width: 390px; display: flex; flex-direction: column; gap: 10px">
    <figcaption style="font-size: 12px; line-height: 16px; font-weight: 700; color: #494d4c">Phone · form tray</figcaption>
    <div style="position: relative; width: 390px; height: 760px; border-radius: 16px; overflow: hidden; background: #00000080">
      <div style="position: absolute; left: 0; right: 0; bottom: 0"><dc-import name="Dialog" layout="phone" kind="form" hint-size="100%,560px"></dc-import></div>
    </div>
  </figure>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"$preview":{"width":2000,"height":1000}}'>
class Component extends DCLogic {
  renderVals() { return {}; }
}
</script>
</body>
</html>
