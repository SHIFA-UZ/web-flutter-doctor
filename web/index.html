<!DOCTYPE html>
<html>
<head>
  <!--
    If you are serving your web app in a path other than the root, change the
    href value below to reflect the base path you are serving from.

    The path provided below has to start and end with a slash "/" in order for
    it to work correctly.

    For more details:
    * https://developer.mozilla.org/en-US/docs/Web/HTML/Element/base

    This is a placeholder for base href that will be replaced by the value of
    the `--base-href` argument provided to `flutter build`.
  -->
  <base href="$FLUTTER_BASE_HREF">

  <meta charset="UTF-8">
  <meta content="IE=Edge" http-equiv="X-UA-Compatible">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0, viewport-fit=cover">
  <meta name="description" content="Shifa Doctor - Professional medical practice management platform">

  <!-- Extra hint for proxies/browsers that respect html-level hints -->
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">

  <!-- iOS meta tags & icons -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <meta name="apple-mobile-web-app-title" content="shifa_doc_app_v1">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">

  <!-- Favicon -->
  <link rel="icon" type="image/png" href="favicon.png"/>

  <title>Shifa Doctor - Staging</title>
  <link rel="manifest" href="manifest.json">
  <style>
    /* Cross-browser baseline (Safari/macOS focus: viewport, fonts, hit targets). */
    html {
      height: 100%;
      height: 100dvh;
    }

    body {
      margin: 0;
      padding: 0;
      height: 100%;
      height: 100dvh;
      overflow: hidden;
      overscroll-behavior: none;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      -webkit-tap-highlight-color: transparent;
      text-size-adjust: 100%;
      -webkit-text-size-adjust: 100%;
    }

    flutter-view,
    flt-glass-pane,
    flt-scene-host,
    flt-scene {
      height: 100%;
      height: 100dvh;
    }

    /* Updated from Dart for Safari dynamic toolbar (see BrowserCompat.bootstrap). */
    @supports (height: calc(var(--vh) * 100)) {
      html,
      body,
      flutter-view,
      flt-glass-pane,
      flt-scene-host,
      flt-scene {
        height: calc(var(--vh, 1vh) * 100);
      }
    }

    /* Platform views (PDF iframe, video embed, file drop) must fill their slot. */
    flt-platform-view,
    flt-platform-view iframe,
    flt-platform-view div {
      display: block;
      width: 100%;
      height: 100%;
    }
  </style>
</head>
<body>
  <!--
    Legacy Flutter web used an offline-first service worker that cache-first'd
    main.dart.js; that keeps stale bundles in normal browsers while incognito looks fine.
    Builds use --pwa-strategy=none; clear old SW + Cache Storage before loading the app.
  -->
  <script>
    (function () {
      function clearLegacyFlutterPwa() {
        var cachePromise = ('caches' in window)
          ? caches.keys().then(function (keys) {
              return Promise.all(keys.map(function (key) {
                if (key.indexOf('flutter-app') === 0 || key.indexOf('flutter-temp') === 0) {
                  return caches.delete(key);
                }
                return Promise.resolve();
              }));
            })
          : Promise.resolve();

        if (!('serviceWorker' in navigator)) {
          return cachePromise.then(function () {
            return false;
          });
        }

        var regPromise = navigator.serviceWorker.getRegistrations().then(function (registrations) {
          var flutterRegs = registrations.filter(function (registration) {
            var script = registration.installing || registration.waiting || registration.active;
            var url = script ? script.scriptURL : '';
            return url.indexOf('flutter_service_worker') !== -1;
          });
          return Promise.all(flutterRegs.map(function (registration) {
            return registration.unregister();
          })).then(function () {
            return flutterRegs.length > 0;
          });
        });

        return Promise.all([regPromise, cachePromise]).then(function (results) {
          return results[0];
        });
      }

      function loadFlutterBootstrap() {
        var s = document.createElement('script');
        s.src = 'flutter_bootstrap.js';
        s.async = true;
        document.body.appendChild(s);
      }

      function registerFirebaseMessagingSw() {
        if (!('serviceWorker' in navigator)) {
          return;
        }
        navigator.serviceWorker.register('/firebase-messaging-sw.js')
          .then(function (registration) {
            console.log('Service Worker registered:', registration);
          })
          .catch(function (err) {
            console.log('Service Worker registration failed:', err);
          });
      }

      clearLegacyFlutterPwa()
        .then(function (unregisteredFlutterSw) {
          var k = 'shifa_sw_purge_reload';
          if (unregisteredFlutterSw) {
            var count = parseInt(sessionStorage.getItem(k) || '0', 10);
            if (count < 2) {
              sessionStorage.setItem(k, String(count + 1));
              window.location.reload();
              return;
            }
          }
          sessionStorage.removeItem(k);
          loadFlutterBootstrap();
          registerFirebaseMessagingSw();
        })
        .catch(function () {
          sessionStorage.removeItem('shifa_sw_purge_reload');
          loadFlutterBootstrap();
          registerFirebaseMessagingSw();
        });
    })();
  </script>
</body>
</html>
